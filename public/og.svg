<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0b0d0d" />
  <text x="90" y="140" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="82" font-weight="800" fill="#e7edeb" letter-spacing="-1">Binary Translator</text>
  <text x="90" y="192" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="27" fill="#7fb8b0">Text ↔ binary · also hex, decimal, octal · full Unicode (UTF-8)</text>
